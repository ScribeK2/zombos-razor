[package]
name = "zombo-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hickory-proto = "0.26.3"
idna = "1.1.0"
psl = "2.1.249"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting", "macros", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
data-encoding = "2.11.1"
