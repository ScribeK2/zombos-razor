[package]
name = "zombo-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hickory-proto = "0.26.3"
idna = "1.1.0"
psl = "2.1.249"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting", "macros", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2.5.8"
webpki-roots = "1.0.11"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
data-encoding = "2.11.1"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
