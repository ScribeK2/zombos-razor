# Dependency policy. Run with `cargo deny check`.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2

[licenses]
version = 2
# Licenses we would accept from a future dependency are listed even if unused today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0", # the Mozilla root certificates bundled by webpki-roots
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
