name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build and smoke without publishing

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag is the single source of truth for the version.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the AppImage and the CLI tarball in an Ubuntu 24.04 container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/build-appimage.sh

      - name: Check the AppImage size budget (40 MB)
        run: |
          size=$(stat -c %s build/dist/Zombos-Razor-*-x86_64.AppImage)
          echo "AppImage: $size bytes"
          test "$size" -lt 40000000

      - name: Smoke test on Ubuntu 24.04 and 26.04
        run: |
          for u in 24.04 26.04; do
            UBUNTU=$u SMOKE_FUSE=0 packaging/smoke.sh build/dist/Zombos-Razor-*-x86_64.AppImage
          done

      # Signs SHA256SUMS with the release key. The trusted comment must be exactly "zombo-razor <version>":
      # the app refuses a signature whose comment names another version (downgrade replay).
      - name: Sign SHA256SUMS (minisign)
        if: github.event_name == 'push'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "::error::MINISIGN_SECRET_KEY or MINISIGN_PASSWORD is not set, refusing to publish an unsigned release"
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -t "zombo-razor $VERSION" \
            -m build/dist/SHA256SUMS -x build/dist/SHA256SUMS.minisig
          # The signature must verify with the public key that is embedded in the app.
          minisign -V -p crates/zombo-core/update_key.pub -m build/dist/SHA256SUMS -x build/dist/SHA256SUMS.minisig
          grep -q "trusted comment: zombo-razor $VERSION\$" build/dist/SHA256SUMS.minisig

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: build/dist/*

      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
