[package]
name = "zombo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1.54.1", features = ["rt", "time"] }
zombo-core = { path = "../crates/zombo-core" }
zombo-ui = { path = "../crates/zombo-ui" }

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.release]
debug = 1

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

